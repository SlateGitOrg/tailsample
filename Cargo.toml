[package]
name = "tailsample"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Tail-based trace sampler: OTLP gRPC/HTTP receiver, bounded trace buffer, budgeted policies, OTLP exporter"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic", "trace", "with-serde"] }
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "gzip", "router", "server", "channel"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
regex = "1"

[dev-dependencies]
proptest = "1.5"

[profile.release]
debug = 1
